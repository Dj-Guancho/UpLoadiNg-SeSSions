<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Sesiones de MEGA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff0055;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
        }
        .playlist {
            flex: 1;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-height: 500px;
            overflow-y: auto;
        }
        .playlist h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 2px solid #ff0055;
            padding-bottom: 5px;
        }
        .track {
            padding: 10px;
            margin: 5px 0;
            background: #2a2a2a;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .track:hover {
            background: #ff0055;
        }
        .player-box {
            flex: 2;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 4px;
            background: #000;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>Mis Sesiones</h1>
    
    <div class="container">
        <!-- Lista de Sesiones -->
        <div class="playlist">
            <h2>Selecciona una sesión</h2>
            <!-- REPLAZA los atributos data-url con tus enlaces de tipo /embed/ de MEGA -->
            <div class="track" data-url="https://mega.nz/file/MBRiRCwD#w0LPH38nEWIGHAWn9nEe_pg6AQjceugillSrDM0NcV0">2026-10-15_Aserrín_6</div>
            <div class="track" data-url="https://mega.nz/file/MBRiRCwD#w0LPH38nEWIGHAWn9nEe_pg6AQjceugillSrDM0NcV0">Sesión 2 - Techno serrin</div>
            <div class="track" data-url="https://mega.nz/embed/EJEMPLO_ID_3#CLAVE_3">Sesión 3 - House Set</div>
        </div>

        <!-- Reproductor -->
        <div class="player-box">
            <iframe id="mega-player" src="" allowfullscreen></h2>Selecciona una sesión de la lista para comenzar a reproducir.</iframe>
        </div>
    </div>

    <script>
        const tracks = document.querySelectorAll('.track');
        const player = document.getElementById('mega-player');

        tracks.forEach(track => {
            track.addEventListener('click', () => {
                const url = track.getAttribute('data-url');
                player.src = url;
            });
        });
    </script>
</body>
</html>
